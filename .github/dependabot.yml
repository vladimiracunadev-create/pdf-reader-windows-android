version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # android/capacitor.settings.gradle esta versionado e incrusta rutas
      # node_modules/.pnpm que incluyen la version del peer @capacitor/core.
      # Subir un solo paquete deja ese archivo generado desincronizado y el
      # paso `git diff --exit-code -- android` de CI falla, asi que Capacitor
      # tiene que llegar siempre en un unico PR.
      capacitor:
        patterns:
          - "@capacitor/*"
    ignore:
      # Electron se mantiene en la rama mayor vigente del proyecto. Las majors
      # se evaluan a mano porque cambian Chromium y Node en el runtime que se
      # distribuye a las personas usuarias, y Electron parchea las tres majors
      # mas recientes al mismo ritmo. El criterio esta en
      # docs/security-updates.md. Las minor y patch siguen llegando solas.
      - dependency-name: "electron"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
