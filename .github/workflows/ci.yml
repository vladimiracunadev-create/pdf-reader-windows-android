name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    name: Web · tests + landing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build:pages
      - uses: actions/upload-artifact@v7
        with:
          name: pages-preview
          path: pages-dist
          if-no-files-found: error

  android-smoke:
    name: Android · APK debug verificado
    needs: web-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci --no-audit --no-fund
      - run: npm run android:sync
      - run: git diff --exit-code -- android
      - name: Test and compile APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew test assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Verify package, version and permissions
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          BADGING="$($AAPT2 dump badging "$APK")"
          grep -q "package: name='cl.vladimiracunadev.pdfreader' versionCode='1' versionName='0.1.0'" <<< "$BADGING"
          if grep -Eq "uses-permission.*(INTERNET|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE)" <<< "$BADGING"; then
            echo "El APK declara un permiso prohibido." >&2
            exit 1
          fi
          mkdir -p release/android
          cp "$APK" release/android/PDF-Reader-Android-v0.1.0-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-preview
          path: release/android/PDF-Reader-Android-v0.1.0-debug.apk
          if-no-files-found: error

  windows-smoke:
    name: Windows · package
    needs: web-quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:windows
      - uses: actions/upload-artifact@v7
        with:
          name: windows-preview
          path: release/windows/*.exe
          if-no-files-found: error
