<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title description">
  <title id="title">Arquitectura Android-first de PDF Reader</title>
  <desc id="description">Un PDF local entra al núcleo compartido de lectura, se procesa con PDF.js, se conserva en almacenamiento local y se presenta mediante adaptadores para Android, Windows y Web, sin servidor ni telemetría.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3157d5"/>
      <stop offset="1" stop-color="#5536b8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <style>
      .heading { font: 700 34px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #f8fafc; }
      .subheading { font: 400 17px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #a8b5cc; }
      .eyebrow { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 1.8px; fill: #7dd3fc; }
      .label { font: 700 18px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #f8fafc; }
      .body { font: 400 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .small { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #dbeafe; }
      .flow { fill: none; stroke: #7dd3fc; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="760" rx="28" fill="url(#background)"/>
  <circle cx="1160" cy="78" r="170" fill="#3157d5" opacity="0.08"/>
  <circle cx="112" cy="706" r="190" fill="#14b8a6" opacity="0.06"/>

  <text x="64" y="62" class="eyebrow">ARQUITECTURA DEL PRODUCTO</text>
  <text x="64" y="104" class="heading">PDF Reader · Android-first</text>
  <text x="64" y="135" class="subheading">Una experiencia compartida, adaptadores nativos mínimos y datos que nunca salen del dispositivo.</text>

  <rect x="42" y="166" width="1196" height="514" rx="24" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="8 8" opacity="0.72"/>
  <rect x="70" y="151" width="224" height="30" rx="15" fill="#12372f" stroke="#34d399"/>
  <text x="182" y="171" text-anchor="middle" class="small" fill="#a7f3d0">FRONTERA LOCAL Y PRIVADA</text>

  <g filter="url(#shadow)">
    <rect x="72" y="264" width="218" height="222" rx="20" fill="#17233a" stroke="#334866" stroke-width="2"/>
    <rect x="94" y="288" width="52" height="64" rx="8" fill="#e2e8f0"/>
    <path d="M130 288 L146 304 L130 304 Z" fill="#94a3b8"/>
    <rect x="104" y="319" width="32" height="4" rx="2" fill="#3157d5"/>
    <rect x="104" y="329" width="24" height="4" rx="2" fill="#3157d5" opacity="0.65"/>
    <text x="94" y="390" class="eyebrow">ENTRADA EXPLÍCITA</text>
    <text x="94" y="423" class="label">PDF local</text>
    <text x="94" y="449" class="body">Selector · arrastrar · intent</text>
    <text x="94" y="471" class="body">El original es solo lectura</text>
  </g>

  <path d="M290 375 H346" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="350" y="205" width="494" height="410" rx="24" fill="#15213a" stroke="#4263de" stroke-width="2"/>
    <rect x="350" y="205" width="494" height="72" rx="24" fill="url(#core)"/>
    <path d="M350 253 H844 V277 H350 Z" fill="url(#core)"/>
    <text x="378" y="232" class="eyebrow" fill="#dbeafe">NÚCLEO COMPARTIDO</text>
    <text x="378" y="260" class="label">HTML · CSS · JavaScript</text>

    <rect x="378" y="305" width="438" height="72" rx="14" fill="#1d2c4a" stroke="#3b82f6"/>
    <circle cx="412" cy="341" r="18" fill="#3157d5"/>
    <path d="M404 341 H420 M412 333 V349" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="444" y="335" class="label">Mozilla PDF.js 6.3.289</text>
    <text x="444" y="358" class="body">Decodificación · páginas · texto</text>

    <path d="M597 377 V400" class="flow"/>

    <rect x="378" y="405" width="438" height="82" rx="14" fill="#1d2c4a" stroke="#8b5cf6"/>
    <circle cx="412" cy="446" r="18" fill="#7c3aed"/>
    <path d="M403 446 H421 M406 439 L412 446 L418 439 M406 453 L412 446 L418 453" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="444" y="439" class="label">Experiencia de lectura</text>
    <text x="444" y="463" class="body">Canvas · miniaturas · búsqueda · zoom táctil</text>

    <path d="M597 487 V510" class="flow"/>

    <rect x="378" y="515" width="438" height="72" rx="14" fill="#1d2c4a" stroke="#14b8a6"/>
    <ellipse cx="412" cy="542" rx="18" ry="8" fill="#0f766e"/>
    <path d="M394 542 V559 C394 570 430 570 430 559 V542" fill="#0f766e"/>
    <ellipse cx="412" cy="559" rx="18" ry="8" fill="#115e59"/>
    <text x="444" y="545" class="label">Persistencia local</text>
    <text x="444" y="568" class="body">IndexedDB: 8 recientes · tema y progreso</text>
  </g>

  <path d="M844 375 H900" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="904" y="205" width="304" height="126" rx="18" fill="#143329" stroke="#34d399" stroke-width="2.5"/>
    <rect x="928" y="229" width="44" height="44" rx="12" fill="#22c55e"/>
    <path d="M940 244 H960 V265 H940 Z M944 238 L947 233 M956 238 L959 233" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="990" y="247" class="eyebrow" fill="#86efac">PLATAFORMA PRINCIPAL</text>
    <text x="990" y="274" class="label">Android 7+</text>
    <text x="928" y="303" class="body">Capacitor + Kotlin · ACTION_VIEW · Share</text>

    <rect x="904" y="351" width="304" height="104" rx="18" fill="#172b45" stroke="#38bdf8"/>
    <rect x="928" y="375" width="42" height="32" rx="5" fill="#0ea5e9"/>
    <path d="M944 411 H954 M949 407 V415" stroke="#7dd3fc" stroke-width="3"/>
    <text x="990" y="386" class="label">Windows 10/11</text>
    <text x="990" y="411" class="body">Electron sandbox · IPC mínimo</text>
    <text x="990" y="433" class="body">Asociación .pdf · setup y portable</text>

    <rect x="904" y="475" width="304" height="104" rx="18" fill="#27213d" stroke="#a78bfa"/>
    <circle cx="949" cy="511" r="20" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
    <path d="M929 511 H969 M949 491 C938 502 938 520 949 531 M949 491 C960 502 960 520 949 531" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <text x="990" y="508" class="label">Web</text>
    <text x="990" y="533" class="body">Navegador · GitHub Pages</text>
    <text x="990" y="555" class="body">Demo sin backend</text>
  </g>

  <g>
    <rect x="350" y="642" width="494" height="56" rx="14" fill="#102a27" stroke="#34d399"/>
    <path d="M378 670 C378 657 396 657 396 670 V681 H378 Z" fill="none" stroke="#6ee7b7" stroke-width="2"/>
    <rect x="374" y="668" width="26" height="19" rx="5" fill="#0f766e"/>
    <text x="416" y="676" class="label" font-size="16">Sin cuenta · sin servidor · sin telemetría</text>
  </g>

  <text x="64" y="726" class="subheading">Los adaptadores nativos exponen capacidades del sistema; la lógica de lectura permanece en un único núcleo auditable.</text>
</svg>
